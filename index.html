<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke UPDS | Reservas</title>

    <meta name="theme-color" content="#0f0a1c">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="img/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra Superior -->
    <nav class="navbar fixed-top glass-nav">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-gradient" href="#">
                <img src="img/logo.png" alt="Logo" width="28" height="28" class="d-inline-block align-text-top me-2 bg-white rounded-circle p-1">
                Karaoke UPDS
            </a>
            <div id="estadoRed" class="badge bg-success shadow-sm">🟢 En Línea</div>
        </div>
    </nav>

    <!-- Contenedor Principal (Sin Scroll Global) -->
    <main class="app-container">

        <!-- VISTA 1: RESERVA -->
        <section id="view-reserva" class="app-view active">
            <div class="glass-card p-3 h-100 d-flex flex-column">
                <h5 class="text-gradient mb-2"><i class="ph ph-calendar-check"></i> Datos de Reserva</h5>

                <form id="formReserva" class="flex-grow-1 overflow-auto pe-1" novalidate>
                    <div class="mb-2">
                        <label class="form-label text-light small mb-0">Nombre o Grupo:</label>
                        <input type="text" id="clienteNombre" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Ej. Alex y los Románticos" required>
                        <small class="text-danger d-none" id="errorNombre">Requerido.</small>
                    </div>

                    <div class="mb-2">
                        <label class="form-label text-light small mb-0">Sala / Turno:</label>
                        <select id="salaSelect" class="form-select form-select-sm bg-dark text-white border-secondary">
                            <option value="Sala VIP 1">Sala VIP 1 (Privada)</option>
                            <option value="Mesa Central 4">Mesa Central 4 (Pública)</option>
                            <option value="Sala Familiar">Sala Familiar (Privada)</option>
                        </select>
                    </div>

                    <hr class="text-secondary my-2">

                    <h6 class="text-gradient mb-2"><i class="ph ph-list-checks"></i> Resumen del Pedido</h6>
                    <div class="p-2 rounded bg-black bg-opacity-50 mb-2">
                        <div class="d-flex justify-content-between text-light small mb-1">
                            <span>Pistas seleccionadas:</span>
                            <span id="countPistas" class="text-warning fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between text-light small mb-1">
                            <span>Snacks / Bebidas:</span>
                            <span id="countExtras" class="text-info fw-bold">0</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold mt-auto" id="btnConfirmar">
                        <i class="ph ph-shield-check"></i> Confirmar Reserva Segura
                    </button>
                </form>
            </div>
        </section>

        <!-- VISTA 2: CATÁLOGO DE PISTAS -->
        <section id="view-pistas" class="app-view">
            <div class="d-flex flex-column h-100">
                <h5 class="text-white mb-2"><i class="ph ph-music-notes"></i> Catálogo de Pistas</h5>
                <div id="catalogoKaraoke" class="lista-canciones flex-grow-1">
                    <!-- Loader -->
                </div>
            </div>
        </section>

        <!-- VISTA 3: SNACKS -->
        <section id="view-snacks" class="app-view">
            <div class="d-flex flex-column h-100">
                <h5 class="text-white mb-2"><i class="ph ph-pizza"></i> Snacks y Comida</h5>
                <div id="catalogoSnacks" class="lista-canciones flex-grow-1"></div>
            </div>
        </section>

        <!-- VISTA 4: BEBIDAS -->
        <section id="view-bebidas" class="app-view">
            <div class="d-flex flex-column h-100">
                <h5 class="text-white mb-2"><i class="ph ph-wine"></i> Bebidas y Refrescos</h5>
                <div id="catalogoBebidas" class="lista-canciones flex-grow-1"></div>
            </div>
        </section>

    </main>

    <!-- Menú de Navegación Inferior (Tabs) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-target="view-reserva">
            <i class="ph ph-calendar-check"></i>
            <span>Reserva</span>
        </a>
        <a href="#" class="nav-item" data-target="view-pistas">
            <i class="ph ph-music-notes"></i>
            <span>Pistas</span>
        </a>
        <a href="#" class="nav-item" data-target="view-snacks">
            <i class="ph ph-pizza"></i>
            <span>Snacks</span>
        </a>
        <a href="#" class="nav-item" data-target="view-bebidas">
            <i class="ph ph-wine"></i>
            <span>Bebidas</span>
        </a>
    </nav>

    <!-- MODAL KARAOKE (Letra y Disco) -->
    <div class="modal fade" id="modalPista" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-lg-down">
            <div class="modal-content glass-modal karaoke-bg text-center p-3">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>

                <div class="vinyl-container mx-auto mb-2">
                    <div class="vinyl-disc"></div>
                    <img id="pistaImgHD" src="" alt="Portada" class="vinyl-cover">
                </div>

                <h4 class="text-white mb-1 fw-bold" id="pistaTitulo">Título</h4>
                <p class="text-gradient mb-2 fw-bold" id="pistaArtista">Artista</p>

                <div class="letra-container mb-3 p-3 rounded-4 text-center flex-grow-1">
                    <p class="karaoke-text m-0" id="pistaLetra">Letra...</p>
                </div>

                <button class="btn btn-gradient w-100 py-2 fs-6 fw-bold" id="btnAgregarDesdeModal">
                    <i class="ph ph-plus-circle"></i> Agregar Pista
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast-alert">
        <i class="ph ph-check-circle fs-4"></i>
        <div>
            <strong class="d-block" id="toastTitulo">¡Éxito!</strong>
            <span class="small" id="toastMensaje">Acción completada.</span>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
