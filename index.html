<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke PWA | Reservas y Catálogo</title>

    <!-- PWA -->
    <meta name="theme-color" content="#09090b">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">

    <!-- Librerías y Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold text-neon" href="#"><i class="ph ph-microphone-stage"></i> Karaoke Pro</a>
            <div id="estadoRed" class="badge bg-success">🟢 En Línea</div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="row g-4">

            <!-- COLUMNA IZQUIERDA: CATÁLOGO CON LAZY LOADING -->
            <div class="col-lg-7">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="section-title m-0">Catálogo de Pistas</h2>
                    <button id="hydrateBtn" class="btn btn-outline-info btn-sm"><i class="ph ph-arrows-clockwise"></i> Hidratar</button>
                </div>

                <div id="alertaRed" class="alert alert-warning d-none" role="alert">
                    <i class="ph ph-warning-circle"></i> Sin conexión. Mostrando catálogo en caché.
                </div>

                <!-- Contenedor del catálogo (Fetch inyecta aquí) -->
                <section id="catalogoKaraoke" class="lista-canciones">
                    <!-- Skeleton Loader (Mientras carga el JSON) -->
                    <div class="text-center py-5 text-muted w-100" style="grid-column: 1 / -1;">
                        <i class="ph ph-spinner-gap fs-1" style="animation: spin 1s linear infinite; color: var(--primary);"></i>
                        <p class="mt-2">Cargando repertorio desde la nube...</p>
                    </div>
                </section>
            </div>

            <!-- COLUMNA DERECHA: RESERVAS Y COLA DE REPRODUCCIÓN -->
            <div class="col-lg-5">
                <div class="glass-card p-4 sticky-top" style="top: 100px;">
                    <h3 class="text-neon mb-4"><i class="ph ph-calendar-check"></i> Reservar Sala</h3>

                    <form id="formReserva" novalidate>
                        <div class="mb-3">
                            <label class="form-label text-light">Nombre del Titular:</label>
                            <input type="text" id="nombreReserva" class="form-control bg-dark text-light border-info" placeholder="Ej. Alex">
                            <small class="text-danger d-none" id="errorNombre">El nombre es obligatorio.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Horas de Karaoke:</label>
                            <input type="number" id="horasReserva" class="form-control bg-dark text-light border-info" value="1" min="1" max="5">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 p-3 rounded" style="background: rgba(0, 242, 254, 0.1);">
                            <span class="fs-5">Total a Pagar:</span>
                            <span class="fs-3 fw-bold text-neon"><span id="totalPagar">50</span> BOB</span>
                        </div>

                        <button type="submit" class="btn btn-neon w-100 py-3 fw-bold">
                            <i class="ph ph-check-circle"></i> Confirmar Reserva
                        </button>
                    </form>

                    <hr class="text-secondary my-4">

                    <h5 class="text-light mb-3"><i class="ph ph-queue"></i> Tu Cola de Karaoke</h5>
                    <ul id="listaCola" class="list-group list-group-flush bg-transparent">
                        <li class="list-group-item bg-transparent text-muted text-center border-0">No hay canciones en cola.</li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast de Notificación -->
    <div id="toast" class="toast-alert">
        <i class="ph ph-check-circle fs-4"></i>
        <div>
            <strong class="d-block" id="toastTitulo">¡Éxito!</strong>
            <span class="small" id="toastMensaje">Acción completada.</span>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
