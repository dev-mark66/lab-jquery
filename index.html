<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke UPDS | Reservas</title>

    <meta name="theme-color" content="#0f0a1c">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="img/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra Superior -->
    <nav class="navbar fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold text-gradient" href="#">
                <img src="img/logo.png" alt="Logo" width="32" height="32" class="d-inline-block align-text-top me-2 bg-white rounded-circle p-1">
                Karaoke UPDS
            </a>
            <div id="estadoRed" class="badge bg-success shadow-sm">🟢 En Línea</div>
        </div>
    </nav>

    <main class="container main-content">
        <div class="row g-4">

            <!-- COLUMNA IZQUIERDA: CATÁLOGO -->
            <div class="col-lg-7">
                <h2 class="section-title mb-3">Catálogo Disponible</h2>
                <div id="alertaRed" class="alert alert-warning d-none small" role="alert">
                    <i class="ph ph-warning-circle"></i> Sin conexión. Catálogo en caché.
                </div>
                <div id="catalogoKaraoke" class="lista-canciones">
                    <div class="text-center py-5 w-100">
                        <div class="spinner-border text-info" role="status"></div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: RESERVA Y COLA -->
            <div class="col-lg-5">
                <div class="glass-card p-4 sticky-top shadow-lg" style="top: 90px;">

                    <h4 class="text-gradient mb-3"><i class="ph ph-queue"></i> Tu Cola Actual</h4>
                    <ul id="listaCola" class="list-group list-group-flush bg-transparent mb-4" style="max-height: 120px; overflow-y: auto;">
                        <li class="list-group-item bg-transparent text-muted text-center border-0 empty-cola">Aún no has elegido canciones.</li>
                    </ul>

                    <hr class="text-secondary">

                    <!-- FORMULARIO ADAPTADO AL PDF (ANTI-XSS) -->
                    <h4 class="text-gradient mb-3"><i class="ph ph-calendar-check"></i> Reserva de Sala</h4>
                    <form id="formReserva" novalidate>
                        <div class="mb-3">
                            <label class="form-label text-light fw-bold">Nombre o Grupo:</label>
                            <input type="text" id="clienteNombre" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Alex y los Románticos" required>
                            <small class="text-danger d-none" id="errorNombre">El nombre es obligatorio.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light fw-bold">Selecciona Sala / Turno:</label>
                            <select id="salaSelect" class="form-select bg-dark text-white border-secondary">
                                <option value="Sala VIP 1 (20:00 hrs)">Sala VIP 1 (20:00 hrs)</option>
                                <option value="Mesa Central 4 (21:30 hrs)">Mesa Central 4 (21:30 hrs)</option>
                                <option value="Sala Familiar 2 (22:00 hrs)">Sala Familiar 2 (22:00 hrs)</option>
                            </select>
                        </div>

                        <button type="submit" id="btnConfirmar" class="btn btn-gradient w-100 py-3 fw-bold fs-5">
                            <i class="ph ph-check-circle"></i> Confirmar Reserva
                        </button>
                    </form>

                    <!-- LISTA DE RESERVAS SEGURA -->
                    <div class="mt-4">
                        <h5 class="text-light mb-2">Tus Reservas:</h5>
                        <ul id="listaReservas" class="lista-segura list-group list-group-flush bg-transparent"></ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL KARAOKE (EXPERIENCIA INMERSIVA) -->
    <div class="modal fade" id="modalPista" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-lg-down">
            <div class="modal-content glass-modal karaoke-bg text-center p-4">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>

                <!-- DISCO GIRANDO (Estructura corregida) -->
                <div class="vinyl-container mx-auto mb-4">
                    <div class="vinyl-disc"></div>
                    <img id="pistaImgHD" src="" alt="Portada" class="vinyl-cover spin-animation">
                </div>

                <h2 class="text-white mb-1 fw-bold" id="pistaTitulo">Título</h2>
                <p class="text-gradient mb-4 fw-bold fs-5" id="pistaArtista">Artista</p>

                <!-- LETRA ESTILO KARAOKE -->
                <div class="letra-container mb-4 p-4 rounded-4 text-center">
                    <p class="karaoke-text m-0" id="pistaLetra">Cargando letra...</p>
                </div>

                <button class="btn btn-gradient w-100 py-3 fs-5 fw-bold shadow-lg" id="btnAgregarDesdeModal">
                    <i class="ph ph-plus-circle"></i> Agregar a la Cola
                </button>
            </div>
        </div>
    </div>

    <!-- Botón Flotante Instalar PWA -->
    <button id="btnInstalar" class="btn btn-light d-none position-fixed shadow-lg d-flex align-items-center gap-2" style="bottom: 20px; right: 20px; z-index: 9999; border-radius: 30px; padding: 10px 20px; font-weight: bold; border: 2px solid #9333ea;">
        <i class="ph ph-download-simple fs-5 text-purple"></i> Instalar App
    </button>

    <!-- Toast -->
    <div id="toast" class="toast-alert">
        <i class="ph ph-check-circle fs-3"></i>
        <div>
            <strong class="d-block" id="toastTitulo">¡Éxito!</strong>
            <span class="small" id="toastMensaje">Acción completada.</span>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
