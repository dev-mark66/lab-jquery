<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke PWA | Catálogo</title>

    <!-- PWA -->
    <meta name="theme-color" content="#6d28d9">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">

    <!-- Fuentes e Iconos y Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold text-neon" href="#"><i class="ph ph-microphone-stage"></i> Karaoke Pro</a>
            <div id="estadoRed" class="badge bg-success">🟢 En Línea</div>
        </div>
    </nav>

    <main class="container main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title m-0">Catálogo de Pistas</h2>
            <button id="hydrateBtn" class="btn btn-outline-info btn-sm"><i class="ph ph-arrows-clockwise"></i> Hidratar</button>
        </div>

        <!-- Contenedor del catálogo -->
        <section id="catalogoKaraoke" class="lista-canciones">
            <div class="text-center py-5 text-muted">
                <i class="ph ph-spinner-gap fs-1" style="animation: spin 1s linear infinite;"></i>
                <p class="mt-2">Cargando repertorio...</p>
            </div>
        </section>
    </main>

    <!-- Toast de Notificación -->
    <div id="toast" class="toast-alert">
        <i class="ph ph-check-circle fs-4"></i>
        <div>
            <strong class="d-block">¡Añadido a la cola!</strong>
            <span class="small">La canción se reproducirá pronto.</span>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
